[package]
name = "ghdeck"
version = "0.1.0"
edition = "2024"
description = "A btop-style GitHub dashboard for the terminal: repos, actions, PRs, issues and deployments"
license = "MIT"
repository = "https://github.com/KristofferRisa/ghdesk"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
nucleo-matcher = "0.3"
open = "5"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "gzip", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
